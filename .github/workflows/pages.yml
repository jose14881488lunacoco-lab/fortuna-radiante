# Publica la app web gratis con HTTPS para instalarla en iPhone desde Safari. Formato JSON: a prueba de pegado.
{
  "name": "iPhone · app web (GitHub Pages)",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main",
        "master"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "pages": "write",
    "id-token": "write"
  },
  "concurrency": {
    "group": "pages",
    "cancel-in-progress": true
  },
  "jobs": {
    "deploy": {
      "runs-on": "ubuntu-latest",
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.publicar.outputs.page_url }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Preparar la app web",
          "run": "ZIP=$(find . -maxdepth 2 -iname '*.zip' | head -1)\nif [ -n \"$ZIP\" ]; then echo \"Usando $ZIP (tiene prioridad sobre las carpetas sueltas)\"; rm -rf _app; mkdir -p _app && unzip -q -o \"$ZIP\" -d _app; fi\nWEB=$(find ./_app -path '*/server/public/index.html' -print 2>/dev/null | head -1)\n[ -z \"$WEB\" ] && WEB=$(find . -path '*/node_modules' -prune -o -path '*/server/public/index.html' -print | head -1)\nif [ -z \"$WEB\" ]; then echo '::error::No encuentro la app. Sube fortuna-radiante.zip al repositorio.'; exit 1; fi\nmkdir -p _site && cp -r \"$(dirname \"$WEB\")\"/. _site/\nAPI=\"${FR_API_URL%/}\"\nprintf 'window.FR_API = \"%s\";\\nwindow.FR_SUPABASE_URL = \"%s\";\\nwindow.FR_SUPABASE_KEY = \"%s\";\\n' \"$API\" \"$SB_URL\" \"$SB_KEY\" > _site/config.js\necho \"App web lista desde $(dirname \"$WEB\")\"",
          "env": {
            "FR_API_URL": "${{ vars.FR_API_URL }}",
            "SB_URL": "${{ vars.FR_SUPABASE_URL }}",
            "SB_KEY": "${{ vars.FR_SUPABASE_KEY }}"
          }
        },
        {
          "uses": "actions/configure-pages@v5"
        },
        {
          "uses": "actions/upload-pages-artifact@v4",
          "with": {
            "path": "_site"
          }
        },
        {
          "id": "publicar",
          "uses": "actions/deploy-pages@v4"
        },
        {
          "name": "Dirección de tu app",
          "run": "echo \"::notice::Tu app está en ${{ steps.publicar.outputs.page_url }} — ábrela en Safari y pulsa Compartir → Añadir a pantalla de inicio\""
        }
      ]
    }
  }
}
