# Fabrica el instalador de Android (APK) en GitHub. Formato JSON: funciona aunque se pierdan los espacios al pegar.
{
  "name": "Android · instalador APK",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main",
        "master"
      ]
    }
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Buscar la carpeta movil",
          "run": "CFG=$(find . -path '*/node_modules' -prune -o -name capacitor.config.json -print | head -1)\nif [ -z \"$CFG\" ]; then\n  ZIP=$(find . -iname '*.zip' -not -path './_app/*' | head -1)\n  if [ -n \"$ZIP\" ]; then echo \"Descomprimiendo $ZIP\"; mkdir -p _app && unzip -q -o \"$ZIP\" -d _app; CFG=$(find ./_app -path '*/node_modules' -prune -o -name capacitor.config.json -print | head -1); fi\nfi\nif [ -z \"$CFG\" ]; then echo \"::error::No encuentro la carpeta movil. Sube al repositorio el archivo fortuna-radiante.zip (tal cual) o las carpetas movil y server.\"; ls -la; exit 1; fi\necho \"MOVIL=$GITHUB_WORKSPACE/$(dirname \"$CFG\")\" >> \"$GITHUB_ENV\"\necho \"Carpeta movil: $(dirname \"$CFG\")\""
        },
        {
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": 22
          }
        },
        {
          "uses": "actions/setup-java@v5",
          "with": {
            "distribution": "temurin",
            "java-version": 21
          }
        },
        {
          "uses": "android-actions/setup-android@v3"
        },
        {
          "name": "Instalar dependencias",
          "run": "cd \"$MOVIL\" && npm install"
        },
        {
          "name": "Preparar app (web, iconos, pantalla de inicio)",
          "run": "cd \"$MOVIL\" && node scripts/prepare.js android",
          "env": {
            "FR_API_URL": "${{ vars.FR_API_URL }}"
          }
        },
        {
          "name": "APK para instalar directamente",
          "run": "cd \"$MOVIL\" && node scripts/gradle.js assembleDebug"
        },
        {
          "name": "Versión firmada para Google Play (solo si has añadido la llave)",
          "env": {
            "KS": "${{ secrets.ANDROID_KEYSTORE_BASE64 }}",
            "KS_PASS": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
            "KS_ALIAS": "${{ secrets.ANDROID_KEY_ALIAS }}",
            "KS_ALIAS_PASS": "${{ secrets.ANDROID_KEY_PASSWORD }}"
          },
          "run": "if [ -z \"$KS\" ]; then echo \"Sin llave de firma: se omite la versión para Google Play.\"; exit 0; fi\ncd \"$MOVIL\"\necho \"$KS\" | base64 -d > \"$RUNNER_TEMP/release.jks\"\nnpx cap build android --keystorepath \"$RUNNER_TEMP/release.jks\" --keystorepass \"$KS_PASS\" --keystorealias \"$KS_ALIAS\" --keystorealiaspass \"$KS_ALIAS_PASS\" --androidreleasetype AAB\nnpx cap build android --keystorepath \"$RUNNER_TEMP/release.jks\" --keystorepass \"$KS_PASS\" --keystorealias \"$KS_ALIAS\" --keystorealiaspass \"$KS_ALIAS_PASS\" --androidreleasetype APK\n"
        },
        {
          "name": "Preparar descarga",
          "run": "mkdir -p \"$GITHUB_WORKSPACE/salida\"\ncp \"$MOVIL/android/app/build/outputs/apk/debug/app-debug.apk\" \"$GITHUB_WORKSPACE/salida/FortunaRadiante.apk\"\nfind \"$MOVIL/android/app/build/outputs\" -name \"*release*.aab\" -exec cp {} \"$GITHUB_WORKSPACE/salida/FortunaRadiante-GooglePlay.aab\" \\; || true\nfind \"$MOVIL/android/app/build/outputs\" -name \"*release*signed*.apk\" -exec cp {} \"$GITHUB_WORKSPACE/salida/FortunaRadiante-firmada.apk\" \\; || true\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "FortunaRadiante-Android",
            "path": "salida/"
          }
        },
        {
          "name": "Si algo falló",
          "if": "failure()",
          "run": "echo '::error::Algo ha fallado. Abre el paso marcado con una X roja (arriba) y copia sus últimas 30 líneas para enviárselas a Claude.'"
        }
      ]
    }
  }
}
