# Fabrica el instalador de Android (APK) en GitHub. Formato JSON: funciona aunque se pierdan los espacios al pegar.
{
  "name": "Android · instalador APK",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main",
        "master"
      ]
    }
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v5"
        },
        {
          "name": "Buscar la carpeta movil",
          "run": "ZIP=$(find . -maxdepth 2 -iname '*.zip' | head -1)\nif [ -n \"$ZIP\" ]; then echo \"Usando $ZIP (tiene prioridad sobre las carpetas sueltas)\"; rm -rf _app; mkdir -p _app && unzip -q -o \"$ZIP\" -d _app; fi\nCFG=$(find ./_app -path '*/node_modules' -prune -o -name capacitor.config.json -print 2>/dev/null | head -1)\n[ -z \"$CFG\" ] && CFG=$(find . -path '*/node_modules' -prune -o -name capacitor.config.json -print | head -1)\nif [ -z \"$CFG\" ]; then echo '::error::No encuentro la carpeta movil. Sube fortuna-radiante.zip al repositorio.'; ls -la; exit 1; fi\necho \"MOVIL=$GITHUB_WORKSPACE/$(dirname \"$CFG\")\" >> \"$GITHUB_ENV\"\necho \"Carpeta movil: $(dirname \"$CFG\")\""
        },
        {
          "name": "Dirección de la web (la app se actualiza sola)",
          "env": {
            "W": "${{ vars.FR_WEB_URL }}"
          },
          "run": "if [ \"$W\" = \"no\" ]; then W=\"\"; elif [ -z \"$W\" ]; then W=\"https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/\"; fi\necho \"FR_WEB_URL=$W\" >> \"$GITHUB_ENV\"\necho \"La app abrirá: ${W:-la copia incluida dentro del APK}\""
        },
        {
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": 22
          }
        },
        {
          "uses": "actions/setup-java@v5",
          "with": {
            "distribution": "temurin",
            "java-version": 21
          }
        },
        {
          "name": "Android SDK (ya viene instalado en GitHub)",
          "run": "echo \"ANDROID_HOME=$ANDROID_HOME\"\nSDKM=$(ls -d \"$ANDROID_HOME\"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)\nif [ -n \"$SDKM\" ]; then yes | \"$SDKM\" --licenses > /dev/null || true; fi"
        },
        {
          "name": "Instalar dependencias",
          "env": {
            "GS": "${{ secrets.GOOGLE_SERVICES_JSON }}"
          },
          "run": "cd \"$MOVIL\"\nif [ -z \"$GS\" ]; then node -e \"const f='package.json',p=require('./'+f);delete p.dependencies['@capacitor/push-notifications'];require('fs').writeFileSync(f,JSON.stringify(p,null,2))\"; echo 'Sin GOOGLE_SERVICES_JSON: APK sin notificaciones'; fi\nnpm install"
        },
        {
          "name": "Preparar app (web, iconos, pantalla de inicio)",
          "run": "cd \"$MOVIL\" && node scripts/prepare.js android",
          "env": {
            "FR_API_URL": "${{ vars.FR_API_URL }}",
            "GOOGLE_SERVICES_JSON": "${{ secrets.GOOGLE_SERVICES_JSON }}"
          }
        },
        {
          "name": "APK para instalar directamente",
          "run": "cd \"$MOVIL\" && node scripts/gradle.js assembleDebug"
        },
        {
          "name": "Versión firmada para Google Play (solo si has añadido la llave)",
          "env": {
            "KS": "${{ secrets.ANDROID_KEYSTORE_BASE64 }}",
            "KS_PASS": "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
            "KS_ALIAS": "${{ secrets.ANDROID_KEY_ALIAS }}",
            "KS_ALIAS_PASS": "${{ secrets.ANDROID_KEY_PASSWORD }}"
          },
          "run": "if [ -z \"$KS\" ]; then echo \"Sin llave de firma: se omite la versión para Google Play.\"; exit 0; fi\ncd \"$MOVIL\"\necho \"$KS\" | base64 -d > \"$RUNNER_TEMP/release.jks\"\nnpx cap build android --keystorepath \"$RUNNER_TEMP/release.jks\" --keystorepass \"$KS_PASS\" --keystorealias \"$KS_ALIAS\" --keystorealiaspass \"$KS_ALIAS_PASS\" --androidreleasetype AAB\nnpx cap build android --keystorepath \"$RUNNER_TEMP/release.jks\" --keystorepass \"$KS_PASS\" --keystorealias \"$KS_ALIAS\" --keystorealiaspass \"$KS_ALIAS_PASS\" --androidreleasetype APK\n"
        },
        {
          "name": "Preparar descarga",
          "run": "mkdir -p \"$GITHUB_WORKSPACE/salida\"\ncp \"$MOVIL/android/app/build/outputs/apk/debug/app-debug.apk\" \"$GITHUB_WORKSPACE/salida/FortunaRadiante.apk\"\nfind \"$MOVIL/android/app/build/outputs\" -name \"*release*.aab\" -exec cp {} \"$GITHUB_WORKSPACE/salida/FortunaRadiante-GooglePlay.aab\" \\; || true\nfind \"$MOVIL/android/app/build/outputs\" -name \"*release*signed*.apk\" -exec cp {} \"$GITHUB_WORKSPACE/salida/FortunaRadiante-firmada.apk\" \\; || true\n"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "FortunaRadiante-Android",
            "path": "salida/"
          }
        },
        {
          "name": "Si algo falló",
          "if": "failure()",
          "run": "echo '::error::Algo ha fallado. Abre el paso marcado con una X roja (arriba) y copia sus últimas 30 líneas para enviárselas a Claude.'"
        }
      ]
    }
  }
}
